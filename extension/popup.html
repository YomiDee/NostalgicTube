<!doctype html><html lang="en"><meta charset="utf-8"><title>NostalgicTube</title><link rel="stylesheet" href="popup.css"><body>
<header class="popup-header"><h1><img class="official-logo" src="assets/logo.png" width="174" height="70" alt="NostalgicTube"></h1></header>
<p class="tagline" data-i18n="tagline">Enjoy what it used to be.</p>
<div class="top-controls"><div class="language-switch"><span lang="en">EN</span><button id="language" class="language-slider" type="button" role="switch" aria-checked="false" aria-label="Español"><span class="language-thumb"></span></button><span lang="es">ES</span></div><label class="enable-label"><input id="enabled" type="checkbox"><span data-i18n="enabledCompact">Enabled</span></label></div>
<form id="settings"><label for="cutoff-display" data-i18n="cutoff">Videos published before</label><input id="cutoff" type="date" min="2006-01-01" required hidden><div class="date-picker"><button id="cutoff-display" type="button" aria-expanded="false" aria-controls="date-calendar"><span class="date-value"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v5M17 3v5M3 11h18M7 15h3M14 15h3"/></svg></button><div id="date-calendar" role="group" hidden></div></div>
<label for="discovery" class="range-label"><span data-i18n="variety">Variety</span><output id="discovery-value" for="discovery">25%</output></label><input id="discovery" type="range" min="0" max="100" step="1" value="25"><div class="range-ends"><span data-i18n="relatedEnd">0% · My topics</span><span>100% · Random</span></div><small id="random-hint" data-i18n="randomCompact" hidden>Random, independent of your interests.</small>
<details class="discovery-languages"><summary data-i18n="discoveryLanguages">Discovery search languages</summary><div class="discovery-language-grid"><label><input type="checkbox" data-discovery-language="en" checked><span>English</span></label><label><input type="checkbox" data-discovery-language="es" checked><span>Español</span></label><label><input type="checkbox" data-discovery-language="pt" checked><span>Português</span></label><label><input type="checkbox" data-discovery-language="fr" checked><span>Français</span></label><label><input type="checkbox" data-discovery-language="de" checked><span>Deutsch</span></label><label><input type="checkbox" data-discovery-language="it" checked><span>Italiano</span></label><label><input type="checkbox" data-discovery-language="ja" checked><span>日本語</span></label><label><input type="checkbox" data-discovery-language="ru" checked><span>Русский</span></label></div><small data-i18n="discoveryLanguagesHelp">Search language, not a strict video language filter. Keep at least one selected.</small></details><div class="options"><label><input id="remember" type="checkbox"><span data-i18n="learnSearchCompact">Learn from searches</span></label><label><input id="learnVideos" type="checkbox"><span data-i18n="learnVideoCompact">Learn from watched videos</span></label><label><input id="replaceHome" type="checkbox"><span data-i18n="replaceCompact">Replace YouTube home</span></label></div></form>
<div class="reset-row"><small data-i18n="localCompact">Learning stays on this device</small><button id="clear" class="reset-button" type="button" data-i18n="clear">Clear all interests</button></div><p id="status" role="status" aria-live="polite"></p>
<footer class="donation-footer"><div class="update-controls"><small id="version" class="extension-version"></small><button id="update" type="button" class="update-button"></button></div><a id="kofi" class="donation-link" href="https://ko-fi.com/yomidee" target="_blank" rel="noopener noreferrer"><svg class="kofi-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect width="24" height="24" rx="6" fill="#29abe0"/><path d="M17 7h2a3 3 0 0 1 0 6h-2v-2h2a1 1 0 0 0 0-2h-2z" fill="white"/><path d="M4 6h13v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="white"/><path d="M10.5 9.5c-2-2-5 .8 0 4.2 5-3.4 2-6.2 0-4.2z" fill="#ff5e5b"/></svg><span data-i18n="donate">Donate with Ko-fi!</span></a></footer>
<script src="search.js"></script><script src="i18n.js"></script><script src="updates.js"></script><script src="calendar.js"></script><script src="popup.js"></script></body></html>
