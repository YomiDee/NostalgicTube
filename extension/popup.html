<!doctype html><html lang="en"><meta charset="utf-8"><title>NostalgicTube</title><link rel="stylesheet" href="popup.css"><body>
<header class="popup-header"><h1><img class="official-logo" src="assets/logo.png" width="174" height="70" alt="NostalgicTube"></h1><a id="kofi" class="donation-link" href="https://ko-fi.com/yomidee" target="_blank" rel="noopener noreferrer"><svg class="kofi-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect width="24" height="24" rx="6" fill="#29abe0"/><path d="M17 7h2a3 3 0 0 1 0 6h-2v-2h2a1 1 0 0 0 0-2h-2z" fill="white"/><path d="M4 6h13v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="white"/><path d="M10.5 9.5c-2-2-5 .8 0 4.2 5-3.4 2-6.2 0-4.2z" fill="#ff5e5b"/></svg><span data-i18n="donate">Donate with Ko-fi</span></a></header>
<p class="tagline" data-i18n="tagline">Enjoy what it used to be</p>
<div class="top-controls"><div class="language-switch"><span lang="en">EN</span><button id="language" class="language-slider" type="button" role="switch" aria-checked="false" aria-label="Español"><span class="language-thumb"></span></button><span lang="es">ES</span></div><label class="enable-label"><input id="enabled" type="checkbox"><span data-i18n="enabledCompact">Enabled</span></label></div>
<form id="settings"><label for="cutoff" data-i18n="cutoff">Videos published before</label><input id="cutoff" type="date" min="2006-01-01" max="2099-12-31" required>
<label for="discovery" class="range-label"><span data-i18n="variety">Variety</span><output id="discovery-value" for="discovery">25%</output></label><input id="discovery" type="range" min="0" max="100" step="1" value="25"><div class="range-ends"><span data-i18n="relatedEnd">0% · My topics</span><span>100% · Random</span></div><small id="random-hint" data-i18n="randomCompact" hidden>Random, independent of your interests.</small>
<div class="options"><label><input id="remember" type="checkbox"><span data-i18n="learnSearchCompact">Learn from searches</span></label><label><input id="learnVideos" type="checkbox"><span data-i18n="learnVideoCompact">Learn from watched videos</span></label><label><input id="replaceHome" type="checkbox"><span data-i18n="replaceCompact">Replace YouTube home</span></label></div><button class="save-button" data-i18n="save">Save</button></form>
<div class="reset-row"><small data-i18n="localCompact">Learning stays on this device</small><button id="clear" class="reset-button" type="button" data-i18n="clear">Clear all interests</button></div><p id="status" role="status" aria-live="polite"></p>
<script src="search.js"></script><script src="i18n.js"></script><script src="popup.js"></script></body></html>
